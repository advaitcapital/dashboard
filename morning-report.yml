name: Morning Market Report

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance requests reportlab matplotlib pandas
      - name: Send report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          WA_RECIPIENTS: ${{ secrets.WA_RECIPIENTS }}
        run: python send_report.py
